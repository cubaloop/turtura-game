<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turtura - Juego TCG & RPG de Naturaleza</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/backpack.css">
</head>
<body>

  <!-- HEADER NAVIGATION -->
  <header class="game-header">
    <div class="game-title">
      <span>🐢</span> TURTURA RPG
    </div>
    <nav class="nav-tabs">
      <button class="tab-btn active" id="tab-btn-world" data-tab="world">
        📖 Capítulos & Mundos
      </button>
      <button class="tab-btn" id="tab-btn-deck" data-tab="deck">
        🎒 Mochila & Mazo
      </button>
      <button class="tab-btn" id="tab-btn-combat" data-tab="combat">
        ⚔️ Batalla & Arena
      </button>
    </nav>
  </header>

  <!-- MAIN GAME CONTAINER -->
  <main class="main-container">
    
    <!-- VIEW 1: CHAPTER HUB (4 THEMATIC GATES) -->
    <section id="view-world" class="view-section active">
      <div id="category-selector-container"></div>
    </section>

    <!-- VIEW 2: POKÉMON SCARLET/VIOLET DECK & SUMMARY SHEET -->
    <section id="view-deck" class="view-section">
      <div id="deck-container"></div>
    </section>

    <!-- VIEW 3: STAGE COMBAT & ARENA -->
    <section id="view-combat" class="view-section">
      <div id="combat-container"></div>
    </section>

  </main>

  <!-- MODALS -->
  <div id="card-modal-container"></div>
  <div id="reward-modal-container"></div>

  <!-- SCRIPT INTEGRATIONS -->
  <script src="js/data/creatures.js"></script>
  <script src="js/data/recipes.js"></script>
  <script src="js/components/CategorySelector.js"></script>
  <script src="js/components/BackpackGrid.js"></script>
  <script src="js/components/CombatEngine.js"></script>
  <script src="js/components/CardModal.js"></script>
  <script src="js/components/RewardModal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
