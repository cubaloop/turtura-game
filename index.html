<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Turtura - RPG de Criaturas & Fusión</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/backpack.css">
</head>
<body>

  <!-- ANIMATED NATURE BACKGROUND CANVAS -->
  <canvas id="animated-nature-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;"></canvas>

  <!-- HEADER NAVIGATION -->
  <header class="game-header">
    <div class="game-title">
      <span>🐢</span> TURTURA
    </div>
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <span id="user-badge-label" style="font-size: 0.85rem; font-weight: 800; color: var(--accent-gold);">🧔🏻‍♂️ Invitado</span>
      <button class="tab-btn" id="btn-auth-open" style="padding: 4px 10px; font-size: 0.75rem;">🔑 Cuenta</button>
    </div>
  </header>

  <!-- MAIN GAME CONTAINER -->
  <main class="main-container" style="position: relative; z-index: 10;">
    
    <!-- VIEW 1: CHAPTER HUB & EVENTS -->
    <section id="view-world" class="view-section">
      <div id="category-selector-container"></div>
    </section>

    <!-- VIEW 2: CRIATURAS (21-SLOT INVENTORY) -->
    <section id="view-deck" class="view-section active">
      <div id="deck-container"></div>
    </section>

    <!-- VIEW 3: STAGE COMBAT & TOWER OF BABEL (100 FLOORS) -->
    <section id="view-combat" class="view-section">
      <div id="combat-container"></div>
    </section>

    <!-- VIEW 4: SHOP / TIENDA -->
    <section id="view-shop" class="view-section">
      <div style="background: rgba(20, 50, 25, 0.92); border: 3px solid var(--border-gold-3d); border-radius: 24px; padding: 2rem; text-align: center;">
        <h2 style="color: var(--accent-gold); font-size: 1.8rem; font-weight: 900; margin-bottom: 1rem;">🛖 Mercado de Cartas & Cofres</h2>
        <p style="color: #cbd5e1;">Mercado de intercambio de gemas y cartas en actualización.</p>
      </div>
    </section>

  </main>

  <!-- STICKY 4-BUTTON BACKPACK BRAWL BOTTOM NAVIGATION BAR -->
  <nav class="bottom-nav-bar">
    <div class="bottom-nav-item" data-target-tab="shop">
      <span class="nav-icon">🛖</span>
      <span>Tienda</span>
    </div>
    <div class="bottom-nav-item active" data-target-tab="deck">
      <span class="nav-icon">🐉</span>
      <span>Criaturas</span>
    </div>
    <div class="bottom-nav-item center-battle-btn" data-target-tab="combat">
      <span class="nav-icon">⚔️</span>
      <span>Batalla (Torre)</span>
    </div>
    <div class="bottom-nav-item" data-target-tab="world">
      <span class="nav-icon">🧪</span>
      <span>Cámara Fusión</span>
    </div>
  </nav>

  <!-- MODALS -->
  <div id="presenter-avatar-container"></div>
  <div id="card-modal-container"></div>
  <div id="reward-modal-container"></div>

  <!-- SCRIPT INTEGRATIONS -->
  <script src="js/data/creatures.js"></script>
  <script src="js/data/recipes.js"></script>
  <script src="js/components/AnimatedBackground.js"></script>
  <script src="js/components/AuthSystem.js"></script>
  <script src="js/components/PresenterAvatar.js"></script>
  <script src="js/components/CategorySelector.js"></script>
  <script src="js/components/BackpackGrid.js"></script>
  <script src="js/components/CombatEngine.js"></script>
  <script src="js/components/CardModal.js"></script>
  <script src="js/components/RewardModal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
