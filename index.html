<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Turtura: La Torre del Poder - RPG de Cartas 3D & Fusión</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

  <!-- Google Model-Viewer for Real Interactive 3D Models (.glb/.gltf) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <!-- CSS Stylesheets (with Cache Busting v=1.2.0) -->
  <link rel="stylesheet" href="css/main.css?v=1.2.0">
</head>
<body class="bg-world">

  <!-- HEADER NAVIGATION (1:1 CURRENCY BAR) -->
  <header class="game-header">
    <div class="game-title" id="btn-header-home">
      <span>🐢</span> TURTURA
    </div>
    <div style="display: flex; align-items: center; gap: 1rem; font-weight: 900; font-size: 0.9rem;">
      <span style="color: #4ade80; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 10px; border: 1px solid #4ade80;">123 💎</span>
      <span style="color: #fbbf24; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 10px; border: 1px solid #fbbf24;">74851 🪙</span>
    </div>
  </header>

  <!-- MAIN GAME CONTAINER SHELL -->
  <main class="main-container">
    
    <!-- VIEW 0: LANDING PAGE (WELCOME HERO SCREEN) -->
    <section id="view-landing" class="view-section active">
      <div id="landing-page-container"></div>
    </section>

    <!-- VIEW 1: CALABOZO (AAA 3D MAIN MENU HUB) -->
    <section id="view-world" class="view-section">
      <div id="category-selector-container"></div>
    </section>

    <!-- VIEW 2: CRIATURAS (INVENTARIO DE CARTAS POKÉMON TCG CON PRESENTACIÓN 3D INTERACTIVA) -->
    <section id="view-deck" class="view-section">
      <div id="deck-manager-container"></div>
    </section>

    <!-- VIEW 3: JVSJ / BATALLA DE LA TORRE DE BABEL 100 PISOS -->
    <section id="view-combat" class="view-section"></section>

    <!-- VIEW 4: CÁMARA DE FUSIÓN 3D -->
    <section id="view-shop" class="view-section"></section>

    <!-- VIEW 5: EVENTOS ESPECIALES -->
    <section id="view-events" class="view-section">
      <div style="text-align: center; padding: 2rem; background: rgba(18, 38, 22, 0.85); border: 2px solid var(--border-gold-3d); border-radius: 20px; color: #fff;">
        <h2 style="color: var(--accent-gold); font-size: 1.6rem; font-weight: 900;">🛡️ Eventos Especiales de Temporada</h2>
        <p style="color: #cbd5e1; margin-top: 0.5rem; font-size: 0.9rem;">Desafíos semanales con modificadores climáticos especiales.</p>
      </div>
    </section>

  </main>

  <!-- STICKY 5-BUTTON MOBILE DOCK NAVIGATION BAR -->
  <nav class="bottom-nav-bar">
    <div class="bottom-nav-item" data-target-tab="shop">
      <span class="nav-icon">🔮</span>
      <span>Fusión</span>
    </div>
    <div class="bottom-nav-item" data-target-tab="deck">
      <span class="nav-icon">🎴</span>
      <span>Criaturas</span>
    </div>
    <div class="bottom-nav-item center-battle-btn active" data-target-tab="world">
      <span class="nav-icon">🏰</span>
      <span>Calabozo</span>
    </div>
    <div class="bottom-nav-item" data-target-tab="combat">
      <span class="nav-icon">⚔️</span>
      <span>JvsJ</span>
    </div>
    <div class="bottom-nav-item" data-target-tab="events">
      <span class="nav-icon">🛡️</span>
      <span>Eventos</span>
    </div>
  </nav>

  <!-- SCRIPT INTEGRATION (WITH CACHE BUSTING v=1.2.0) -->
  <script src="js/data/creatures.js?v=1.2.0"></script>
  <script src="js/components/AIAssistant.js?v=1.2.0"></script>
  <script src="js/components/LandingPage.js?v=1.2.0"></script>
  <script src="js/components/CategorySelector.js?v=1.2.0"></script>
  <script src="js/components/DeckManager.js?v=1.2.0"></script>
  <script src="js/components/CombatEngine.js?v=1.2.0"></script>
  <script src="js/components/FusionSynthesizer.js?v=1.2.0"></script>
  <script src="js/app.js?v=1.2.0"></script>
</body>
</html>
